name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wecos-ocr
    permissions:
      id-token: write
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build hatchling

    - name: Build distributions
      run: |
        python -m build

    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

    # A release page with zero assets is a dead end for anyone who cannot reach
    # PyPI, so the same distributions are attached to the GitHub release as well.
    # Runs last and on failure, so a broken asset upload can never block the
    # PyPI publish above.
    - name: Attach distributions to the GitHub release
      if: always() && hashFiles('dist/*') != ''
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
